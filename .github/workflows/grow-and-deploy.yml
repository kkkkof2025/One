name: Grow and Deploy Knowledge Tree

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Maximum Wikidata requests for this run"
        required: false
        default: "20"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: knowledge-tree
  cancel-in-progress: false

jobs:
  grow:
    name: Grow data and build static site
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name: "${{ steps.pages_artifact.outputs.name }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Grow JSON knowledge tree
        env:
          ONE_MAX_REQUESTS: ${{ inputs.max_requests || '20' }}
        run: python scripts/grow_json.py

      - name: Commit generated data
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-grow knowledge tree"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push was rejected. Rebasing onto origin/${GITHUB_REF_NAME} and retrying (${attempt}/3)."
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
            done
            echo "Failed to push generated data after 3 attempts."
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp index.html public/
          cp -R data public/data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Select Pages artifact name
        id: pages_artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: "${{ steps.pages_artifact.outputs.name }}"
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: grow
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: "${{ needs.grow.outputs.pages_artifact_name }}"
