name: Expand and Build Knowledge Tree

on:
  schedule:
    - cron: "0 0 * * *"  # 每天定时运行
  workflow_dispatch:  # 手动触发

jobs:
  build:
    name: Expand and Generate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install Wikipedia library
      run: pip install wikipedia-api

    - name: Expand and Split Knowledge
      run: python dynamic_expand_and_split.py

    - name: Commit and Push Changes
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add .
        git commit -m "Auto-expand categories and split files"
        git push
