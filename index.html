<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One 万物知识树</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #eef3f6;
      --text: #18212f;
      --muted: #687484;
      --line: #d6dde5;
      --accent: #0f7a8a;
      --accent-soft: #ddf3f5;
      --child: #1b8a5a;
      --sibling: #b45f1c;
      --focus: #29364a;
      --error: #b42318;
      --warn: #8a5a00;
      --shadow: 0 18px 50px rgba(31, 45, 61, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 36px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto minmax(160px, 1fr);
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .switcher {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .switcher button,
    .cloud-action {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      padding: 0 12px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
    }

    .switcher button.active,
    .cloud-action {
      color: #ffffff;
      background: var(--accent);
    }

    .meta {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .growth-panel {
      display: grid;
      grid-template-columns: repeat(4, minmax(116px, 1fr)) minmax(220px, 1.25fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-tile,
    .history-tile {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 9px 12px;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .stat-value {
      display: block;
      margin-top: 5px;
      color: var(--text);
      font-size: 20px;
      font-weight: 720;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .history-tile {
      padding-bottom: 6px;
    }

    .history-tile summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 38px;
      color: var(--muted);
      cursor: pointer;
      list-style: none;
    }

    .history-tile summary::-webkit-details-marker {
      display: none;
    }

    .history-title {
      color: var(--text);
      font-weight: 650;
    }

    .history-count {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 13px;
    }

    .history-list {
      display: grid;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .history-row {
      display: grid;
      grid-template-columns: minmax(118px, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      min-height: 22px;
    }

    .history-add {
      color: var(--child);
      font-weight: 650;
    }

    .history-total {
      color: var(--text);
    }

    .review-panel {
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 10px 12px;
    }

    .review-panel summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 34px;
      color: var(--muted);
      cursor: pointer;
      list-style: none;
    }

    .review-panel summary::-webkit-details-marker {
      display: none;
    }

    .review-title {
      color: var(--text);
      font-weight: 650;
    }

    .review-count {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 13px;
    }

    .review-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .review-filter {
      width: min(260px, 100%);
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--text);
      background: #fbfcfd;
      cursor: pointer;
      outline: none;
    }

    .review-filter:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 122, 138, 0.14);
    }

    .review-meta {
      flex: 1 1 260px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .review-list {
      display: grid;
      gap: 7px;
      max-height: 340px;
      margin-top: 8px;
      overflow-y: auto;
    }

    .review-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 9px;
      color: var(--text);
      background: #f7fafc;
      text-align: left;
      cursor: pointer;
    }

    .review-item:hover,
    .review-item:focus,
    .review-item:focus-within {
      border-color: rgba(15, 122, 138, 0.36);
      background: var(--accent-soft);
      outline: none;
    }

    .review-item-main {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .review-item-side {
      display: grid;
      gap: 6px;
      justify-items: end;
      align-content: start;
      min-width: 96px;
    }

    .review-item-title {
      display: block;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .review-primary {
      width: max-content;
      max-width: 100%;
      border-radius: 999px;
      padding: 3px 7px;
      color: #ffffff;
      background: var(--warn);
      font-size: 11px;
      font-weight: 650;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .review-primary.error {
      background: var(--error);
    }

    .review-primary.duplicate_id {
      background: #7a4d00;
    }

    .review-primary.non_zh_label {
      background: var(--accent);
    }

    .review-item-path,
    .review-item-key,
    .review-item-action,
    .review-item-reasons,
    .review-item-score {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .review-item-score {
      min-width: 82px;
      text-align: right;
    }

    .review-key-button {
      min-height: 28px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0 8px;
      color: var(--accent);
      background: #ffffff;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .review-key-button:disabled {
      color: #7a8795;
      border-color: #cbd5df;
      background: #f3f6f9;
      cursor: default;
    }

    .review-key-button.copied {
      color: #ffffff;
      border-color: var(--child);
      background: var(--child);
    }

    .navigation-panel {
      display: grid;
      grid-template-columns: minmax(260px, 1.15fr) minmax(220px, 0.9fr) minmax(260px, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-box,
    .path-box,
    .detail-box {
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 10px 12px;
    }

    .search-label,
    .path-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(108px, auto) auto;
      gap: 8px;
      align-items: center;
    }

    .search-input,
    .search-filter {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--text);
      background: #fbfcfd;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 122, 138, 0.14);
    }

    .search-filter {
      color: var(--text);
      cursor: pointer;
    }

    .utility-button {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      padding: 0 11px;
      color: #ffffff;
      background: var(--accent);
      cursor: pointer;
      white-space: nowrap;
    }

    .utility-button:disabled {
      color: #7a8795;
      background: #d7dee6;
      cursor: default;
    }

    .search-results {
      display: grid;
      gap: 5px;
      max-height: 184px;
      margin-top: 8px;
      overflow-y: auto;
    }

    .search-result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      width: 100%;
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 7px 8px;
      color: var(--text);
      background: #f7fafc;
      text-align: left;
      cursor: pointer;
    }

    .search-result:hover,
    .search-result:focus {
      border-color: rgba(15, 122, 138, 0.36);
      background: var(--accent-soft);
      outline: none;
    }

    .search-result-title {
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 650;
    }

    .search-result-path,
    .search-result-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .search-message {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      padding: 2px 0;
    }

    .global-path {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 34px;
    }

    .node-details {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 34px;
      align-items: flex-start;
    }

    .detail-pill {
      max-width: 100%;
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--text);
      background: #edf2f7;
      font-size: 12px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .detail-pill.error {
      color: var(--error);
      background: #ffe7e4;
    }

    .detail-pill.review {
      color: var(--warn);
      background: #fff4d6;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      margin-top: 4px;
    }

    .detail-action {
      min-height: 30px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0 9px;
      color: var(--accent);
      background: #ffffff;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .detail-action:disabled {
      color: #7a8795;
      border-color: #cbd5df;
      background: #f3f6f9;
      cursor: default;
    }

    .detail-action.copied {
      color: #ffffff;
      border-color: var(--child);
      background: var(--child);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .cloud-stage {
      position: relative;
      height: min(680px, calc(100vh - 190px));
      min-height: 500px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(214, 221, 229, 0.42) 1px, transparent 1px),
        linear-gradient(0deg, rgba(214, 221, 229, 0.42) 1px, transparent 1px),
        #fbfcfd;
      background-size: 44px 44px;
      box-shadow: var(--shadow);
      touch-action: none;
    }

    .cloud-layer {
      position: absolute;
      inset: 0;
      transform: translate3d(var(--drift-x, 0), var(--drift-y, 0), 0);
      will-change: transform;
    }

    .cloud-center-mark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 126px;
      height: 126px;
      border: 1px dashed rgba(15, 122, 138, 0.38);
      border-radius: 999px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      left: calc(50% + var(--x));
      top: calc(50% + var(--y));
      display: grid;
      place-items: center;
      width: var(--size);
      min-width: var(--size);
      height: var(--size);
      padding: 10px;
      border: 1px solid rgba(24, 33, 47, 0.08);
      border-radius: 999px;
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 12px 34px rgba(27, 39, 54, 0.16);
      transform:
        translate(-50%, -50%)
        scale(var(--scale, 1));
      animation: bubbleIn 260ms ease both;
      transition:
        transform 220ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease,
        background 160ms ease;
      user-select: none;
      cursor: pointer;
    }

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(calc(var(--scale, 1) * 0.88));
      }
      to {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(var(--scale, 1));
      }
    }

    .bubble.focus {
      width: 150px;
      min-width: 150px;
      height: 150px;
      color: #ffffff;
      background: var(--focus);
      box-shadow: 0 22px 54px rgba(41, 54, 74, 0.28);
      cursor: default;
      z-index: 4;
    }

    .bubble.child {
      border-color: rgba(27, 138, 90, 0.25);
      z-index: 3;
    }

    .bubble.sibling {
      border-color: rgba(180, 95, 28, 0.28);
      background: #fff9f4;
      z-index: 2;
    }

    .bubble.target {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 18px 46px rgba(15, 122, 138, 0.24);
      transform:
        translate(-50%, -50%)
        scale(calc(var(--scale, 1) + 0.06));
    }

    .bubble.focus .bubble-status {
      color: rgba(255, 255, 255, 0.72);
    }

    .bubble-title {
      display: -webkit-box;
      max-width: 100%;
      overflow: hidden;
      text-align: center;
      overflow-wrap: anywhere;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      font-size: 14px;
      line-height: 1.25;
    }

    .bubble.focus .bubble-title {
      font-size: 18px;
      font-weight: 700;
    }

    .bubble-status {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .cloud-actionbar {
      position: absolute;
      left: 18px;
      top: 18px;
      display: flex;
      gap: 8px;
      z-index: 8;
    }

    .cloud-action:disabled {
      background: #d7dee6;
      color: #7a8795;
      cursor: default;
    }

    .cloud-path {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 8px 10px;
      overflow-x: auto;
      border: 1px solid rgba(214, 221, 229, 0.82);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--muted);
      font-size: 13px;
      z-index: 8;
    }

    .path-item {
      flex: 0 0 auto;
      border: 0;
      padding: 3px 7px;
      border-radius: 5px;
      color: var(--text);
      background: #edf2f7;
      cursor: pointer;
    }

    .path-separator {
      color: #9aa6b4;
    }

    .vector-hud {
      position: absolute;
      right: 18px;
      top: 18px;
      min-width: 178px;
      border: 1px solid rgba(214, 221, 229, 0.9);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      z-index: 8;
    }

    .vector-hud strong {
      color: var(--text);
      font-weight: 650;
    }

    .tree-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      box-shadow: var(--shadow);
    }

    .chart-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chart-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    .chart-button {
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      padding: 0 11px;
      color: #ffffff;
      background: var(--accent);
      cursor: pointer;
      white-space: nowrap;
    }

    .chart-button:disabled {
      color: #7a8795;
      background: #d7dee6;
      cursor: default;
    }

    .chart-status {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .chart-canvas {
      width: 100%;
      height: min(680px, calc(100vh - 242px));
      min-height: 500px;
      background:
        linear-gradient(90deg, rgba(214, 221, 229, 0.32) 1px, transparent 1px),
        linear-gradient(0deg, rgba(214, 221, 229, 0.32) 1px, transparent 1px),
        #fbfcfd;
      background-size: 40px 40px;
    }

    .tree-node {
      min-width: 280px;
    }

    .tree-row {
      display: grid;
      grid-template-columns: 28px minmax(120px, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      border-radius: 6px;
      padding: 2px 8px 2px 2px;
    }

    .tree-row:hover {
      background: #f0f4f8;
    }

    .tree-toggle {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-size: 16px;
      line-height: 28px;
    }

    .tree-toggle:disabled {
      color: var(--muted);
      cursor: default;
    }

    .tree-title {
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.35;
      cursor: pointer;
    }

    .status {
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      background: #edf1f6;
      color: var(--muted);
    }

    .status.loaded {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .status.pending {
      color: var(--warn);
      background: #fff4d6;
    }

    .status.error {
      color: var(--error);
      background: #ffe7e4;
    }

    .tree-children {
      display: none;
      margin-left: 14px;
      padding-left: 14px;
      border-left: 1px solid var(--line);
    }

    .tree-node.expanded > .tree-children {
      display: block;
    }

    .message {
      margin: 8px 0 8px 38px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 740px) {
      .app {
        width: min(100% - 20px, 1180px);
        padding-top: 14px;
      }

      .topbar {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .meta {
        text-align: left;
      }

      .growth-panel {
        grid-template-columns: 1fr;
      }

      .navigation-panel {
        grid-template-columns: 1fr;
      }

      .history-row {
        grid-template-columns: 1fr auto;
      }

      .history-total {
        grid-column: 2;
      }

      .review-item {
        grid-template-columns: 1fr;
      }

      .review-item-side {
        grid-template-columns: auto auto;
        justify-content: start;
        justify-items: start;
        min-width: 0;
      }

      .review-item-score {
        text-align: left;
      }

      .cloud-stage {
        height: calc(100vh - 292px);
        min-height: 440px;
      }

      .chart-toolbar {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .chart-status {
        flex-basis: 100%;
        margin-left: 0;
        text-align: left;
      }

      .chart-canvas {
        height: calc(100vh - 344px);
        min-height: 440px;
      }

      .vector-hud {
        display: none;
      }

      .bubble:not(.focus) {
        width: min(var(--size), 94px);
        min-width: min(var(--size), 94px);
        height: min(var(--size), 94px);
      }

      .bubble.focus {
        width: 128px;
        min-width: 128px;
        height: 128px;
      }

      .tree-row {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .status {
        grid-column: 2;
        width: max-content;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>One 万物知识树</h1>
      <div class="switcher" role="tablist" aria-label="视图切换">

  <script src="data/api/client.js"></script>
  <script>
    const CONFIG = {
      centerDeadRadius: 66,
      aimRadius: 112,
      triggerRadius: 152,
      sectorCos: 0.84,
      fastSectorCos: 0.78,
      dwellMs: 520,
      fastDwellMs: 170,
      cooldownMs: 620,
      driftScale: 0.18,

      speedTrigger: 680,
      unlockAngleDeg: 20,
      unlockDistance: 86,
      maxChildren: 18,
      maxSiblings: 14,
      apiBase: "data/api",
      searchMaxNodes: 2500,

      contextChildLimit: 80,
      reviewQueueVisibleLimit: 16,
      echartsUrls: [
        "https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js",
        "https://unpkg.com/echarts@5/dist/echarts.min.js"
      ],
      echartsLoadTimeoutMs: 12000,
      chartMaxChildren: 36,
      chartCompactChildren: 24,
      chartNodeBudget: 90,
      chartCompactNodeBudget: 58,
      chartSlowMs: 90,
      chartRecoverMs: 45,

    };

    const metaEl = document.getElementById("meta");
    const cloudTab = document.getElementById("cloudTab");
    const treeTab = document.getElementById("treeTab");
    const chartTab = document.getElementById("chartTab");
    const cloudView = document.getElementById("cloudView");
    const treeView = document.getElementById("treeView");
    const chartView = document.getElementById("chartView");
    const cloudStage = document.getElementById("cloudStage");
    const cloudLayer = document.getElementById("cloudLayer");
    const cloudPath = document.getElementById("cloudPath");
    const cloudBack = document.getElementById("cloudBack");
    const cloudHome = document.getElementById("cloudHome");
    const vectorHud = document.getElementById("vectorHud");
    const treeEl = document.getElementById("tree");
    const chartCanvas = document.getElementById("chartCanvas");
    const chartBack = document.getElementById("chartBack");
    const chartHome = document.getElementById("chartHome");
    const chartCompact = document.getElementById("chartCompact");
    const chartStatus = document.getElementById("chartStatus");
    const totalNodeCountEl = document.getElementById("totalNodeCount");
    const lastAddedCountEl = document.getElementById("lastAddedCount");
    const lastRunAtEl = document.getElementById("lastRunAt");
    const endNodeCountEl = document.getElementById("endNodeCount");
    const historyCountEl = document.getElementById("historyCount");
    const growthHistoryListEl = document.getElementById("growthHistoryList");
    const reviewCountEl = document.getElementById("reviewCount");
    const reviewFilter = document.getElementById("reviewFilter");
    const reviewMetaEl = document.getElementById("reviewMeta");
    const reviewDistributionEl = document.getElementById("reviewDistribution");
    const reviewListEl = document.getElementById("reviewList");
    const nodeSearch = document.getElementById("nodeSearch");
    const searchFilter = document.getElementById("searchFilter");
    const clearSearch = document.getElementById("clearSearch");
    const searchResults = document.getElementById("searchResults");
    const globalPath = document.getElementById("globalPath");
    const nodeDetails = document.getElementById("nodeDetails");
    const exportMarkdown = document.getElementById("exportMarkdown");
    const exportJson = document.getElementById("exportJson");
    const downloadMarkdown = document.getElementById("downloadMarkdown");
    const downloadJson = document.getElementById("downloadJson");
    const copyNodeApi = document.getElementById("copyNodeApi");
    const copyChildrenApi = document.getElementById("copyChildrenApi");
    const copyEndNodeApi = document.getElementById("copyEndNodeApi");
    const copyApiClient = document.getElementById("copyApiClient");

    const cache = new Map();
    let rootNode = null;
    let statsData = null;
    let growthHistory = [];
    let endNodeData = null;
    let reviewQueueData = null;
    let reviewDecisionData = null;
    let searchIndex = [];
    let searchIndexPromise = null;
    let searchToken = 0;
    let cloudTrail = [];
    let cloudTargets = [];
    let activeTargetKey = "";
    let activeTargetSince = 0;
    let lastNavAt = 0;
    let navInFlight = false;
    let gestureLock = null;
    let lastPointer = null;
    let lastPointerAt = 0;
    let lastIntent = null;
    let pointerSpeed = 0;
    let driftCurrent = { x: 0, y: 0 };
    let driftTarget = { x: 0, y: 0 };
    let activeMode = "cloud";
    let echartsLoader = null;
    let treeChart = null;
    let chartTrail = [];
    let chartExpanded = new Map();
    let chartNodeContext = new Map();
    let chartRenderToken = 0;
    let chartRenderCount = 0;
    let chartHiddenCount = 0;
    let chartRenderMs = 0;
    let chartPerformanceMode = "normal";
    let chartZoom = 1;
    let chartCenter = ["50%", "20%"];
    let chartIgnoreRoam = false;
    let chartLastDepthLimit = 2;
    let chartExpandTick = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function formatNumber(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "--";
      return new Intl.NumberFormat("zh-CN").format(number);
    }

    function formatAdded(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "--";
      return number > 0 ? `+${formatNumber(number)}` : formatNumber(number);
    }

    function formatDateTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "--";
      return new Intl.DateTimeFormat("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function setCloudDriftTarget(x, y) {
      driftTarget = {
        x: clamp(x, -CONFIG.maxDrift, CONFIG.maxDrift),
        y: clamp(y, -CONFIG.maxDrift, CONFIG.maxDrift)
      };
    }

    function applyCloudDrift() {
      cloudLayer.style.setProperty("--drift-x", `${driftCurrent.x.toFixed(1)}px`);
      cloudLayer.style.setProperty("--drift-y", `${driftCurrent.y.toFixed(1)}px`);
    }

    function animateCloudDrift() {
      driftCurrent.x += (driftTarget.x - driftCurrent.x) * CONFIG.driftEase;
      driftCurrent.y += (driftTarget.y - driftCurrent.y) * CONFIG.driftEase;

      if (Math.abs(driftTarget.x - driftCurrent.x) < 0.05) {
        driftCurrent.x = driftTarget.x;
      }
      if (Math.abs(driftTarget.y - driftCurrent.y) < 0.05) {
        driftCurrent.y = driftTarget.y;
      }

      applyCloudDrift();
      requestAnimationFrame(animateCloudDrift);
    }

    function intentAngle(intent) {
      return Math.atan2(intent.dy, intent.dx);
    }

    function angleDelta(a, b) {
      const diff = Math.abs(a - b) % (Math.PI * 2);
      return diff > Math.PI ? Math.PI * 2 - diff : diff;
    }

    function lockGesture(intent) {
      gestureLock = {
        angle: intentAngle(intent),
        distance: intent.distance
      };
      activeTargetKey = "";
      activeTargetSince = 0;
    }

    function unlockGesture() {
      gestureLock = null;
    }

    function gestureIsLocked(intent) {
      if (!gestureLock) return false;

      const angleChanged = angleDelta(intentAngle(intent), gestureLock.angle);
      const distanceChanged = Math.abs(intent.distance - gestureLock.distance);
      if (
        angleChanged > CONFIG.unlockAngleDeg * Math.PI / 180 ||
        distanceChanged > CONFIG.unlockDistance
      ) {
        unlockGesture();
        return false;
      }

      return true;
    }

    function statusLabel(status) {
      if (status === "loaded") return "已加载";
      if (status === "error") return "错误";
      if (status === "manual") return "手动";
      return "待扩展";
    }

    function emptyLabel(node) {
      if (node.children_status === "error") return node.last_error || "加载失败";
      if (node.children_status === "pending") return "等待定时任务扩展";
      if (node.is_leaf) return "已确认无可扩展子节点";
      return "暂无子类";
    }

    function nodeKey(node, fallback = "") {
      return node.id || node.data_source || node.title || fallback;
    }

    function canExpand(node) {
      return Boolean(
        node.data_source ||
        (Array.isArray(node.children) && node.children.length > 0) ||
        node.children_status === "pending" ||
        node.children_status === "error"
      );
    }

    async function fetchJson(path) {
      if (cache.has(path)) return cache.get(path);
      const response = await fetch(path, { cache: "no-cache" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      cache.set(path, data);
      return data;
    }

    function sourcePathForNode(node) {
      if (!node) return "";
      if (node.id === "root") return "root.json";
      if (node.data_source) return node.data_source;
      if (node.id && /^Q\d+$/.test(String(node.id))) return `nodes/${node.id}.json`;
      return "";
    }

    function nodeIdForApi(node) {
      if (!node) return "";
      return String(node.id || "").trim();
    }

    function apiPath(path) {
      return `${CONFIG.apiBase}/${path}`.replace(/\/+/g, "/");
    }

    function nodeApiPath(node) {
      const id = nodeIdForApi(node);
      if (id) return apiPath(`by-id/${encodeURIComponent(id)}/node.json`);
      const source = sourcePathForNode(node);
      return source ? apiPath(source) : "";
    }

    function childrenApiPath(node) {
      const id = nodeIdForApi(node);
      if (id) return apiPath(`by-id/${encodeURIComponent(id)}/children.json`);
      const source = sourcePathForNode(node);
      return source ? apiPath(`children/${source}`) : "";
    }

    function endNodeApiPath() {
      return apiPath("getEndNode.json");
    }

    function apiClientPath() {
      return apiPath("client.js");
    }

    function staticApiClient() {
      const client = window.OneKnowledgeApi;
      if (client && typeof client.getNode === "function" && typeof client.getChildren === "function") {
        return client;
      }
      return null;
    }

    function absoluteApiUrl(path) {
      return new URL(path, window.location.href).href;
    }

    function unwrapNodePayload(payload) {
      if (payload && payload.endpoint === "node" && payload.node) return payload.node;
      return payload;
    }

    const dataApi = {
      async getRoot() {
        const client = staticApiClient();
        if (client && typeof client.getRoot === "function") {
          try {
            return await client.getRoot();
          } catch (error) {
            // Fall through to direct fetch.
          }
        }
        try {
          return unwrapNodePayload(await fetchJson(apiPath("by-id/root/node.json")));
        } catch (error) {
          try {
            return unwrapNodePayload(await fetchJson(apiPath("root.json")));
          } catch (fallbackError) {
            return fetchJson("data/root.json");
          }
        }
      },
      async getNode(node) {
        const client = staticApiClient();
        if (client && typeof client.getNode === "function") {
          try {
            return await client.getNode(node);
          } catch (error) {
            // Fall through to direct fetch.
          }
        }
        const path = nodeApiPath(node);
        if (path) {
          try {
            return unwrapNodePayload(await fetchJson(path));
          } catch (error) {
            // Fall through to the raw data shard for older deployments.
          }
        }
        if (node?.data_source) {
          return fetchJson(`data/${node.data_source}`);
        }
        return node;
      },
      async getChildren(node) {
        const client = staticApiClient();
        if (client && typeof client.getChildren === "function") {
          try {
            return await client.getChildren(node);
          } catch (error) {
            // Fall through to hydrated node data.
          }
        }
        const path = childrenApiPath(node);
        if (path) {
          try {
            return fetchJson(path);
          } catch (error) {
            // Fall through to hydrated node data.
          }
        }
        const hydrated = await dataApi.getNode(node);
        return {
          endpoint: "children",
          node: compactNode(hydrated),
          child_count: Array.isArray(hydrated.children) ? hydrated.children.length : 0,
          children: Array.isArray(hydrated.children) ? hydrated.children.map(compactNode) : []
        };
      },
      async getStats() {
        return fetchJson("data/stats.json");
      },
      async getHistory(stats) {
        const historyFile = stats?.history_file || "growth_history.json";
        return fetchJson(`data/${historyFile}`);
      },
      async getReviewQueue() {
        return fetchJson("data/review_queue.json");
      },
      async getReviewDecisions(queue) {
        const decisionFile = queue?.decision_file || "review_decisions.json";
        return fetchJson(`data/${decisionFile}`);
      },
      async getEndNode() {
        const client = staticApiClient();
        if (client && typeof client.getEndNode === "function") {
          try {
            return await client.getEndNode();
          } catch (error) {
            // Fall through to direct fetch.
          }
        }
        try {
          return fetchJson(endNodeApiPath());
        } catch (error) {
          return fetchJson("data/end_nodes.json");
        }
      }
    };

    async function hydrateNode(node) {
      if (!node) return node;
      const loaded = await dataApi.getNode(node);
      return Object.assign({}, node, loaded);
    }

    async function safeHydrateNode(node) {
      try {
        return await hydrateNode(node);
      } catch (error) {
        return Object.assign({}, node, {
          children_status: "error",
          last_error: "数据文件加载失败",
          children: []
        });
      }
    }

    function present(value) {
      return value !== undefined && value !== null && value !== "";
    }

    function cloneTrail(trail) {
      return trail.map((entry) => Object.assign({}, entry));
    }

    function activeTrail() {
      if (activeMode === "chart" && chartTrail.length > 0) return chartTrail;
      return cloudTrail;
    }

    function currentNode() {
      const trail = activeTrail();
      const entry = trail[trail.length - 1];
      return entry ? entry.node : null;
    }

    function trailPathText(trail) {
      return trail.map((entry) => entry.node.title || "未命名").join(" / ");
    }

    function compactNode(node) {
      const summary = {
        title: node.title || "未命名",
        children_count: Array.isArray(node.children) ? node.children.length : 0
      };
      [
        "id",
        "data_source",
        "source_provider",
        "source_relation",
        "source_url",
        "children_status",
        "is_leaf",
        "quality_score",
        "review_status",
        "updated_at",
        "last_checked_at",
        "end_reason",
        "ended_at",
        "last_error",
        "last_fetch_source",
        "last_fetch_sources",
        "last_source_errors",
        "source_no_children",
        "source_checked"
      ].forEach((field) => {
        if (present(node[field])) summary[field] = node[field];
      });
      const nodeEndpoint = nodeApiPath(node);
      const childrenEndpoint = childrenApiPath(node);
      if (nodeEndpoint) summary.api_node = nodeEndpoint;
      if (childrenEndpoint) summary.api_children = childrenEndpoint;
      return summary;
    }

    function normalizeSearchText(value) {
      return String(value || "").trim().toLocaleLowerCase("zh-CN");
    }

    function searchTextFor(node, path) {
      return normalizeSearchText([
        node.title,
        node.id,
        node.data_source,
        node.source_provider,
        node.source_relation,
        node.children_status,
        node.review_status,
        sourceNoChildrenText(node),
        path
      ].filter(Boolean).join(" "));
    }

    function renderSearchMessage(message) {
      searchResults.innerHTML = "";
      if (!message) return;
      const item = document.createElement("div");
      item.className = "search-message";
      item.textContent = message;
      searchResults.append(item);
    }

    async function buildSearchIndex() {
      const entries = [];
      const visitedSources = new Set();

      async function visit(node, trail) {
        if (!node || entries.length >= CONFIG.searchMaxNodes) return;

        const hydrated = await safeHydrateNode(node);
        Object.assign(node, hydrated);

        const path = trailPathText(trail);
        entries.push({
          node,
          trail: cloneTrail(trail),
          path,
          searchText: searchTextFor(node, path)
        });

        const source = node.data_source || "";
        if (source) {
          if (visitedSources.has(source)) return;
          visitedSources.add(source);
        }

        const children = Array.isArray(node.children) ? node.children : [];
        for (let index = 0; index < children.length; index += 1) {
          if (entries.length >= CONFIG.searchMaxNodes) break;
          const child = children[index];
          if (!child || typeof child !== "object") continue;

          const childTrail = trail.concat({
            node: child,
            parent: node,
            siblings: children,
            index
          });
          await visit(child, childTrail);
        }
      }

      if (rootNode) {
        await visit(rootNode, [{
          node: rootNode,
          parent: null,
          siblings: [rootNode],
          index: 0
        }]);
      }

      return entries;
    }

    function ensureSearchIndex() {
      if (searchIndexPromise) return searchIndexPromise;
      searchIndexPromise = buildSearchIndex()
        .then((entries) => {
          searchIndex = entries;
          return entries;
        })
        .catch((error) => {
          searchIndexPromise = null;
          throw error;
        });
      return searchIndexPromise;
    }

    function renderSearchMatches(matches) {
      searchResults.innerHTML = "";
      if (matches.length === 0) {
        renderSearchMessage("没有匹配节点");
        return;
      }

      matches.forEach((result) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "search-result";
        button.setAttribute("role", "option");

        const text = document.createElement("span");
        const title = document.createElement("span");
        title.className = "search-result-title";
        title.textContent = result.node.title || "未命名";

        const path = document.createElement("span");
        path.className = "search-result-path";
        path.textContent = result.path;
        const source = document.createElement("span");
        source.className = "search-result-meta";
        source.textContent = [
          result.node.id,
          result.node.source_relation,
          result.node.review_status === "needs_review" ? "待审" : ""
        ].filter(Boolean).join(" · ");
        text.append(title, path, source);

        const status = document.createElement("span");
        status.className = `status ${result.node.children_status || "pending"}`;
        status.textContent = statusLabel(result.node.children_status);

        button.append(text, status);
        button.addEventListener("click", () => {
          nodeSearch.value = result.node.title || "";
          navigateToTrail(result.trail, "cloud");
        });
        searchResults.append(button);
      });
    }

    function searchFilterMatches(node, filter) {
      if (filter === "all") return true;
      if (filter === "needs_review") return node.review_status === "needs_review";
      return node.children_status === filter;
    }

    function runSearch() {
      const query = normalizeSearchText(nodeSearch.value);
      const filter = searchFilter.value;
      const token = ++searchToken;

      if (!query && filter === "all") {
        renderSearchMessage("");
        return;
      }

      renderSearchMessage("搜索中");
      ensureSearchIndex()
        .then((entries) => {
          if (token !== searchToken) return;
          const terms = query.split(/\s+/).filter(Boolean);
          const matches = entries
            .filter((entry) => searchFilterMatches(entry.node, filter))
            .filter((entry) => terms.every((term) => entry.searchText.includes(term)))
            .slice(0, CONFIG.searchMaxResults);
          renderSearchMatches(matches);
        })
        .catch(() => {
          if (token === searchToken) renderSearchMessage("搜索索引加载失败");
        });
    }

    function makePathButton(entry, trail, index) {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "path-item";
      item.textContent = entry.node.title || "未命名";
      item.addEventListener("click", () => {
        const mode = activeMode === "chart" ? "chart" : "cloud";
        navigateToTrail(trail.slice(0, index + 1), mode);
      });
      return item;
    }

    function renderGlobalPath() {
      const trail = activeTrail();
      globalPath.innerHTML = "";
      if (!trail.length) {
        globalPath.textContent = "等待数据";
        return;
      }

      trail.forEach((entry, index) => {
        if (index > 0) {
          const separator = document.createElement("span");
          separator.className = "path-separator";
          separator.textContent = "›";
          globalPath.append(separator);
        }
        globalPath.append(makePathButton(entry, trail, index));
      });
    }

    function detailPill(label, value, className = "") {
      const item = document.createElement("span");
      item.className = `detail-pill ${className}`.trim();
      item.textContent = `${label}: ${value}`;
      return item;
    }

    function sourceNoChildrenText(node) {
      const data = node?.source_no_children;
      if (!data || typeof data !== "object") return "";
      return Object.keys(data).filter(Boolean).sort().join(", ");
    }

    function sourceCheckedText(node) {
      const data = node?.source_checked;
      if (!data || typeof data !== "object") return "";
      return Object.keys(data).filter(Boolean).sort().join(", ");
    }

    function renderNodeDetails() {
      const node = currentNode();
      nodeDetails.innerHTML = "";
      [
        exportMarkdown,
        exportJson,
        downloadMarkdown,
        downloadJson,
        copyNodeApi,
        copyChildrenApi,
        copyEndNodeApi,
        copyApiClient
      ].forEach((button) => {
        button.disabled = !node;
      });

      if (!node) {
        nodeDetails.textContent = "等待数据";
        return;
      }
      copyNodeApi.disabled = !nodeApiPath(node);
      copyChildrenApi.disabled = !childrenApiPath(node);
      copyEndNodeApi.disabled = false;
      copyApiClient.disabled = false;

      const children = Array.isArray(node.children) ? node.children : [];
      const fields = [
        ["ID", node.id],
        ["平台", node.source_provider],
        ["来源", node.source_relation],
        ["来源页", node.source_url],
        ["状态", statusLabel(node.children_status)],
        ["分片", node.data_source],
        ["抓取源", node.last_fetch_source],
        ["更新", node.updated_at],
        ["检查", node.last_checked_at],
        ["质量", present(node.quality_score) ? `${node.quality_score}/100` : ""],
        ["待审", node.review_status === "needs_review" ? "是" : ""],
        ["终止", node.is_leaf ? (node.end_reason || "是") : ""],
        ["已查空来源", sourceNoChildrenText(node)],
        ["已检查来源", sourceCheckedText(node)],
        ["子节点", children.length]
      ];

      fields.forEach(([label, value]) => {
        if (!present(value)) return;
        const className = label === "待审" ? "review" : "";
        nodeDetails.append(detailPill(label, value, className));
      });

      if (node.last_error) {
        nodeDetails.append(detailPill("错误", node.last_error, "error"));
      }

      if (nodeDetails.children.length === 0) {
        nodeDetails.textContent = "暂无来源信息";
      }
    }

    function updateNavigation() {
      renderGlobalPath();
      renderNodeDetails();
    }

    function setTrail(trail) {
      const next = cloneTrail(trail);
      cloudTrail = next;
      chartTrail = cloneTrail(next);
    }

    function navigateToTrail(trail, mode = "cloud") {
      setTrail(trail);
      if (mode === "chart" && activeMode === "chart") {
        renderChart();
        updateNavigation();
        return;
      }

      if (activeMode !== "cloud") {
        setMode("cloud");
      } else {
        renderCloud();
        resetCloudPointerState();
      }
    }

    function contextMarkdown(data) {
      const lines = [
        "# One 节点上下文",
        "",
        `生成时间: ${data.generated_at}`,
        "",
        "## 当前节点"
      ];

      Object.entries(data.current_node).forEach(([key, value]) => {
        lines.push(`- ${key}: ${value}`);
      });

      lines.push("", "## 路径");
      data.path.forEach((node, index) => {
        const details = [node.id, node.data_source, node.source_provider, node.source_relation]
          .filter(Boolean)
          .join(", ");
        lines.push(`${index + 1}. ${node.title}${details ? ` (${details})` : ""}`);
      });

      lines.push("", "## 子节点");
      if (data.children.length === 0) {
        lines.push("- 无");
      } else {
        data.children.forEach((node) => {
          const details = [
            node.id,
            node.data_source,
            node.source_provider,
            node.source_relation,
            node.children_status
          ]
            .filter(Boolean)
            .join(", ");
          lines.push(`- ${node.title}${details ? ` (${details})` : ""}`);
        });
      }

      if (data.truncated_children > 0) {
        lines.push(`- 另有 ${data.truncated_children} 个子节点未导出`);
      }

      return `${lines.join("\n")}\n`;
    }

    async function currentAiContextData() {
      const trail = cloneTrail(activeTrail());
      if (!trail.length) return null;

      const current = trail[trail.length - 1];
      const hydrated = await safeHydrateNode(current.node);
      Object.assign(current.node, hydrated);

      if (activeMode === "chart") {
        chartTrail = trail;
      } else {
        cloudTrail = trail;
      }
      updateNavigation();

      const children = Array.isArray(current.node.children) ? current.node.children : [];
      return {
        project: "One",
        generated_at: new Date().toISOString(),
        path: trail.map((entry) => compactNode(entry.node)),
        parent_path: trail.slice(0, -1).map((entry) => compactNode(entry.node)),
        current_node: compactNode(current.node),
        children: children.slice(0, CONFIG.contextChildLimit).map(compactNode),
        child_count: children.length,
        truncated_children: Math.max(0, children.length - CONFIG.contextChildLimit)
      };
    }

    async function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "0";
      document.body.append(textarea);
      textarea.select();
      const ok = document.execCommand("copy");
      textarea.remove();
      if (!ok) throw new Error("copy failed");
    }

    async function copyContext(format, button) {
      const defaultText = button.dataset.defaultText || button.textContent;
      button.dataset.defaultText = defaultText;
      button.disabled = true;

      try {
        const data = await currentAiContextData();
        if (!data) throw new Error("no current node");
        const text = format === "json"
          ? `${JSON.stringify(data, null, 2)}\n`
          : contextMarkdown(data);
        await writeClipboard(text);
        button.textContent = "已复制";
        button.classList.add("copied");
      } catch (error) {
        button.textContent = "复制失败";
      }

      window.setTimeout(() => {
        button.textContent = defaultText;
        button.classList.remove("copied");
        button.disabled = !currentNode();
      }, 1200);
    }

    function contextFilename(data, extension) {
      const node = data.current_node || {};
      const base = String(node.id || node.title || "node")
        .replace(/[^A-Za-z0-9_-]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 60) || "node";
      return `one-context-${base}.${extension}`;
    }

    async function downloadContext(format, button) {
      const defaultText = button.dataset.defaultText || button.textContent;
      button.dataset.defaultText = defaultText;
      button.disabled = true;

      try {
        const data = await currentAiContextData();
        if (!data) throw new Error("no current node");
        const isJson = format === "json";
        const text = isJson
          ? `${JSON.stringify(data, null, 2)}\n`
          : contextMarkdown(data);
        const blob = new Blob([text], {
          type: isJson ? "application/json;charset=utf-8" : "text/markdown;charset=utf-8"
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = contextFilename(data, isJson ? "json" : "md");
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        button.textContent = "已下载";
        button.classList.add("copied");
      } catch (error) {
        button.textContent = "下载失败";
      }

      window.setTimeout(() => {
        button.textContent = defaultText;
        button.classList.remove("copied");
        button.disabled = !currentNode();
      }, 1200);
    }

    async function copyApiEndpoint(kind, button) {
      const defaultText = button.dataset.defaultText || button.textContent;
      button.dataset.defaultText = defaultText;
      button.disabled = true;

      try {
        const node = currentNode();
        let path = "";
        if (kind === "node") path = nodeApiPath(node);
        if (kind === "children") path = childrenApiPath(node);
        if (kind === "endNode") path = endNodeApiPath();
        if (kind === "client") path = apiClientPath();
        if (!path) throw new Error("missing api path");
        await writeClipboard(absoluteApiUrl(path));
        button.textContent = "已复制";
        button.classList.add("copied");
      } catch (error) {
        button.textContent = "复制失败";
      }

      window.setTimeout(() => {
        button.textContent = defaultText;
        button.classList.remove("copied");
        renderNodeDetails();
      }, 1200);
    }

    async function loadGrowthStats() {
      try {
        statsData = await dataApi.getStats();
      } catch (error) {
        statsData = null;
        growthHistory = [];
        endNodeData = null;
        renderGrowthStats();
        return;
      }

      try {
        const history = await dataApi.getHistory(statsData);
        growthHistory = Array.isArray(history) ? history : [];
      } catch (error) {
        growthHistory = [];
      }

      try {
        endNodeData = await dataApi.getEndNode();
      } catch (error) {
        endNodeData = null;
      }

      renderGrowthStats();
    }

    function renderGrowthStats() {
      if (!statsData) {
        totalNodeCountEl.textContent = "--";
        lastAddedCountEl.textContent = "--";
        lastRunAtEl.textContent = "--";
        endNodeCountEl.textContent = "--";
        historyCountEl.textContent = "等待统计";
        growthHistoryListEl.textContent = "下一次 GitHub Actions 运行后会生成统计记录";
        return;
      }

      totalNodeCountEl.textContent = formatNumber(statsData.total_nodes);
      lastAddedCountEl.textContent = formatAdded(statsData.last_added_nodes);
      lastRunAtEl.textContent = formatDateTime(statsData.generated_at);
      endNodeCountEl.textContent = formatNumber(
        statsData.end_node_count ?? endNodeData?.total_items
      );
      historyCountEl.textContent = `${formatNumber(growthHistory.length)} 条`;

      const recent = growthHistory.slice(-8).reverse();
      growthHistoryListEl.innerHTML = "";
      if (recent.length === 0) {
        growthHistoryListEl.textContent = "暂无记录";
        return;
      }

      recent.forEach((entry) => {
        const row = document.createElement("div");
        row.className = "history-row";

        const time = document.createElement("span");
        time.textContent = formatDateTime(entry.run_at);

        const added = document.createElement("span");
        added.className = "history-add";
        added.textContent = formatAdded(entry.added_nodes);

        const total = document.createElement("span");
        total.className = "history-total";
        const requestText = entry.requests !== undefined
          ? ` · 查 ${formatNumber(entry.requests)}`
          : "";
        total.textContent = `总 ${formatNumber(entry.total_nodes)}${requestText}`;

        row.append(time, added, total);
