    async function loadReviewQueue() {
      try {
        reviewQueueData = await dataApi.getReviewQueue();
      } catch (error) {
        reviewQueueData = null;
        reviewDecisionData = null;
        renderReviewQueue();
        return;
      }

      try {
        reviewDecisionData = await dataApi.getReviewDecisions(reviewQueueData);
      } catch (error) {
        reviewDecisionData = null;
      }
      renderReviewQueue();
    }

    function reviewDecisionEntries() {
      const decisions = reviewDecisionData?.decisions;
      if (!decisions || typeof decisions !== "object") return [];
      return Object.entries(decisions)
        .filter(([, entry]) => entry && typeof entry === "object")
        .map(([key, entry]) => Object.assign({ key }, entry));
    }

    function latestReviewDecisionTime(entries) {
      let latest = null;
      entries.forEach((entry) => {
        const date = new Date(entry.updated_at || "");
        if (Number.isNaN(date.getTime())) return;
        if (!latest || date > latest) latest = date;
      });
      return latest;
    }

    function renderReviewMeta() {
      if (!reviewQueueData) {
        reviewMetaEl.textContent = "已处理 -- · 最近 --";
        reviewDistributionEl.textContent = "原因分布 --";
        return;
      }

      const decisions = reviewDecisionEntries();
      const latest = latestReviewDecisionTime(decisions);
      const parts = [
        `生成 ${formatDateTime(reviewQueueData.generated_at)}`,
        `已处理 ${formatNumber(decisions.length)}`,
        `最近 ${latest ? formatDateTime(latest.toISOString()) : "--"}`
      ];
      const suppressed = Number(reviewQueueData.suppressed_items);
      if (Number.isFinite(suppressed) && suppressed > 0) {
        parts.push(`已隐藏 ${formatNumber(suppressed)}`);
      }
      reviewMetaEl.textContent = parts.join(" · ");
      renderReviewDistribution();
    }

    function renderReviewDistribution() {
      const categories = reviewQueueData?.reason_distribution?.categories;
      if (!Array.isArray(categories) || categories.length === 0) {
        reviewDistributionEl.textContent = "原因分布 --";
        return;
      }
      reviewDistributionEl.textContent = `原因分布：${categories.slice(0, 6).map((item) => (
        `${item.label || item.key} ${formatNumber(item.count || 0)}`
      )).join(" · ")}`;
    }

    function reviewReasons(item) {
      return Array.isArray(item.quality_reasons)
        ? item.quality_reasons.map((reason) => String(reason))
        : [];
    }

    function reviewHasReason(item, key) {
      return reviewReasons(item).some((reason) => (
        reason === key || reason.startsWith(`${key}:`)
      ));
    }

    function reviewFilterMatches(item, filter) {
      if (!filter || filter === "all") return true;
      if (filter === "needs_review") return item.review_status === "needs_review";
      if (filter === "loaded") return item.children_status === "loaded";
      if (filter === "pending") return item.children_status === "pending";
      if (filter === "error") return item.children_status === "error" || reviewHasReason(item, "error");
      if (filter === "low_quality") {
        const score = Number(item.quality_score);
        const threshold = Number(reviewQueueData?.threshold);
        if (Number.isFinite(score) && Number.isFinite(threshold)) return score <= threshold;
        return item.review_status === "needs_review";
      }
      return reviewHasReason(item, filter);
    }

    function reviewReasonSummary(item) {
      const labels = [];
      if (item.review_status === "needs_review") labels.push("待人工复核");
      if (item.children_status) labels.push(statusLabel(item.children_status));

      reviewReasons(item).forEach((reason) => {
        if (reason === "non_zh_label") labels.push("缺少中文标签");
        if (reason.startsWith("duplicate_id:")) labels.push("重复 ID 风险");
        if (reason === "disambiguation") labels.push("消歧义标题");
        if (reason === "broad_title") labels.push("过泛标题");
        if (reason === "missing_title") labels.push("缺少标题");
        if (reason === "last_error") labels.push("加载错误");
      });

      return Array.from(new Set(labels)).slice(0, 5).join(" · ");
    }

    function primaryReasonLabel(item) {
      if (item.primary_reason_label) return item.primary_reason_label;
      const summary = reviewReasonSummary(item).split(" · ").filter(Boolean);
      return summary[0] || "人工复核";
    }

    function selectReviewItem(item) {
      nodeSearch.value = item.id || item.title || "";
      searchFilter.value = "all";
      runSearch();
      nodeSearch.focus();
    }

    async function copyReviewKey(reviewKey, button) {
      if (!reviewKey) return;
      const defaultText = button.dataset.defaultText || button.textContent;
      button.dataset.defaultText = defaultText;
      button.disabled = true;

      try {
        await writeClipboard(reviewKey);
        button.textContent = "已复制";
        button.classList.add("copied");
      } catch (error) {
        button.textContent = "复制失败";
      }

      window.setTimeout(() => {
        button.textContent = defaultText;
        button.classList.remove("copied");
        button.disabled = false;
      }, 1200);
    }

    function renderReviewQueue() {
      reviewListEl.innerHTML = "";
      renderReviewMeta();
      if (!reviewQueueData || !Array.isArray(reviewQueueData.items)) {
        reviewCountEl.textContent = "待生成";
        reviewListEl.textContent = "下一次生成后会显示复核节点";
        return;
      }

      const items = reviewQueueData.items;
      const filter = reviewFilter.value || "all";
      const filtered = items.filter((item) => reviewFilterMatches(item, filter));
      reviewCountEl.textContent = filter === "all"
        ? `${formatNumber(items.length)} 项`
        : `${formatNumber(filtered.length)} / ${formatNumber(items.length)} 项`;

      if (items.length === 0) {
        reviewListEl.textContent = "暂无记录";
        return;
      }
      if (filtered.length === 0) {
        reviewListEl.textContent = "当前筛选没有记录";
        return;
      }

      filtered.slice(0, CONFIG.reviewQueueVisibleLimit).forEach((item) => {
        const row = document.createElement("div");
        row.className = "review-item";
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        row.setAttribute("aria-label", `搜索复核项 ${item.title || item.review_key || "未命名"}`);

        const main = document.createElement("span");
        main.className = "review-item-main";
        const title = document.createElement("span");
        title.className = "review-item-title";
        title.textContent = item.title || "未命名";

        const primary = document.createElement("span");
        primary.className = `review-primary ${item.primary_reason || ""}`.trim();
        primary.textContent = primaryReasonLabel(item);

        const path = document.createElement("span");
        path.className = "review-item-path";
        path.textContent = item.path || item.location || "";

        const action = document.createElement("span");
        action.className = "review-item-action";
        action.textContent = item.suggested_action || "";

        const key = document.createElement("span");
        key.className = "review-item-key";
        key.textContent = item.review_key ? `key: ${item.review_key}` : "";

        const reasons = document.createElement("span");
        reasons.className = "review-item-reasons";
        reasons.textContent = reviewReasonSummary(item);
        main.append(title, primary, path, key, reasons, action);

        const side = document.createElement("span");
        side.className = "review-item-side";
        const score = document.createElement("span");
        score.className = "review-item-score";
        score.textContent = [
          item.quality_score !== undefined ? `质量 ${item.quality_score}` : "",
          item.priority !== undefined ? `优先 ${item.priority}` : ""
        ].filter(Boolean).join(" · ");

        const keyButton = document.createElement("button");
        keyButton.type = "button";
        keyButton.className = "review-key-button";
        keyButton.textContent = item.review_key ? "复制 key" : "无 key";
        keyButton.disabled = !item.review_key;
        keyButton.setAttribute("aria-label", item.review_key ? `复制 ${item.review_key}` : "没有 review_key");
        keyButton.addEventListener("click", (event) => {
          event.stopPropagation();
          copyReviewKey(item.review_key, keyButton);
        });

        side.append(score, keyButton);
        row.append(main, side);
        row.addEventListener("click", () => selectReviewItem(item));
        row.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          selectReviewItem(item);
        });
        reviewListEl.append(row);
      });

      if (filtered.length > CONFIG.reviewQueueVisibleLimit) {
        const message = document.createElement("div");
        message.className = "search-message";
        message.textContent = `仅显示前 ${formatNumber(CONFIG.reviewQueueVisibleLimit)} 项，可缩小筛选后继续查看`;
        reviewListEl.append(message);
      }
    }

    async function loadRoot() {
      rootNode = await dataApi.getRoot();
      cache.set("data/root.json", rootNode);
      metaEl.textContent = rootNode.updated_at ? `更新于 ${rootNode.updated_at}` : "";
      cloudTrail = [{
        node: rootNode,
        parent: null,
        siblings: [rootNode],
        index: 0
      }];
      chartTrail = [{
        node: rootNode,
        parent: null,
        siblings: [rootNode],
        index: 0
      }];
      searchIndex = [];
      searchIndexPromise = null;
      updateNavigation();
    }

    function visibleChildren(node) {
      return (Array.isArray(node.children) ? node.children : []).slice(0, CONFIG.maxChildren);
    }

    function visibleSiblings() {
      const top = cloudTrail[cloudTrail.length - 1];
      return top.siblings
        .map((node, index) => ({ node, index }))
        .filter((item) => item.index !== top.index)
        .slice(0, CONFIG.maxSiblings);
    }

    function currentCloudNode() {
      return cloudTrail[cloudTrail.length - 1].node;
    }

    function createBubble(node, kind, x, y, size, scale, target) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `bubble ${kind}`;
      button.style.setProperty("--x", `${Math.round(x)}px`);
      button.style.setProperty("--y", `${Math.round(y)}px`);
      button.style.setProperty("--size", `${size}px`);
      button.style.setProperty("--scale", scale.toFixed(2));
      button.dataset.targetKey = target ? target.key : "";

      const title = document.createElement("span");
      title.className = "bubble-title";
      title.textContent = node.title || "未命名";
      button.append(title);

      if (kind !== "focus") {
        const status = document.createElement("span");
        status.className = "bubble-status";
        status.textContent = kind === "child" ? statusLabel(node.children_status) : "同层";
        button.append(status);
      } else {
        const status = document.createElement("span");
        status.className = "bubble-status";
        status.textContent = statusLabel(node.children_status);
        button.append(status);
      }

      if (target) {
        button.addEventListener("click", () => navigateTarget(target, "click"));
      }

      return button;
    }

    function childPosition(index, count, radius) {
      const start = -Math.PI / 2;
      const angle = start + (Math.PI * 2 * index) / Math.max(count, 1);
      const depth = 0.92 + 0.16 * Math.sin(angle + Math.PI / 6);
      return {
        angle,
        x: Math.cos(angle) * radius * depth,
        y: Math.sin(angle) * radius * depth,
        scale: 0.9 + 0.08 * Math.cos(angle - Math.PI / 5)
      };
    }

    function siblingPosition(index, count, radius) {
      const spread = Math.min(Math.PI * 1.35, Math.PI * 0.35 + count * 0.18);
      const angle = Math.PI * 0.15 + (count === 1 ? 0 : (spread * index) / (count - 1));
      return {
        angle,
        x: Math.cos(angle) * radius,
        y: Math.sin(angle) * radius,
        scale: 0.78
      };
    }

    function renderPath() {
      cloudPath.innerHTML = "";
      cloudTrail.forEach((entry, index) => {
        if (index > 0) {
          const separator = document.createElement("span");
          separator.className = "path-separator";
          separator.textContent = "›";
          cloudPath.append(separator);
        }

        const item = document.createElement("button");
        item.type = "button";
        item.className = "path-item";
        item.textContent = entry.node.title || "未命名";
        item.addEventListener("click", () => {
          cloudTrail = cloudTrail.slice(0, index + 1);
          renderCloud();
          resetCloudPointerState();
        });
        cloudPath.append(item);
      });
    }

    function renderVectorHud(target) {
      if (!cloudTrail.length) {
        vectorHud.innerHTML = "";
        return;
      }
      const current = currentCloudNode();
      const children = visibleChildren(current).length;
      const siblings = visibleSiblings().length;
      const targetText = target ? target.node.title || "未命名" : "中心";
      vectorHud.innerHTML = `
        <div><strong>${targetText}</strong></div>
        <div>子节点 ${children} · 同层 ${siblings}</div>
        <div>速度 ${Math.round(pointerSpeed)} px/s</div>
      `;
    }

    function renderCloud() {
      const node = currentCloudNode();
      cloudTargets = [];
      activeTargetKey = "";
      activeTargetSince = 0;
      cloudLayer.innerHTML = "";
      cloudLayer.append(createBubble(node, "focus", 0, 0, 150, 1, null));

      const mark = document.createElement("div");
      mark.className = "cloud-center-mark";
      cloudLayer.append(mark);

      const rect = cloudStage.getBoundingClientRect();
      const base = Math.min(rect.width, rect.height);
      const childRadius = clamp(base * 0.32, 160, 250);
      const siblingRadius = clamp(base * 0.43, 220, 330);

      const children = visibleChildren(node);
      children.forEach((child, index) => {
        const pos = childPosition(index, children.length, childRadius);
        const target = {
          key: `child:${nodeKey(child, index)}`,
          type: "child",
          node: child,
          index,
          angle: pos.angle,
          x: pos.x,
          y: pos.y
        };
        cloudTargets.push(target);
        cloudLayer.append(createBubble(child, "child", pos.x, pos.y, 104, pos.scale, target));
      });

      const siblings = visibleSiblings();
      siblings.forEach((item, index) => {
        const pos = siblingPosition(index, siblings.length, siblingRadius);
        const target = {
          key: `sibling:${nodeKey(item.node, item.index)}`,
          type: "sibling",
          node: item.node,
          index: item.index,
          angle: pos.angle,
          x: pos.x,
          y: pos.y
        };
        cloudTargets.push(target);
        cloudLayer.append(createBubble(item.node, "sibling", pos.x, pos.y, 96, pos.scale, target));
      });

      cloudBack.disabled = cloudTrail.length <= 1;
      cloudHome.disabled = cloudTrail.length <= 1;
      renderPath();
      renderVectorHud(null);
      updateNavigation();
    }

    async function navigateTarget(target, source = "manual") {
      if (navInFlight) return;
      navInFlight = true;
      const top = cloudTrail[cloudTrail.length - 1];

      try {
        if (target.type === "child") {
          const hydrated = await safeHydrateNode(target.node);
          cloudTrail.push({
            node: hydrated,
            parent: top.node,
            siblings: Array.isArray(top.node.children) ? top.node.children : [],
            index: target.index
          });
          renderCloud();
          if (source === "auto" && lastIntent) {
            lockGesture(lastIntent);
          } else {
            resetCloudPointerState();
          }
          return;
        }

        if (target.type === "sibling") {
          const hydrated = await safeHydrateNode(target.node);
          cloudTrail[cloudTrail.length - 1] = {
            node: hydrated,
            parent: top.parent,
            siblings: top.siblings,
            index: target.index
          };
          renderCloud();
          if (source === "auto" && lastIntent) {
            lockGesture(lastIntent);
          } else {
            resetCloudPointerState();
          }
        }
      } finally {
        navInFlight = false;
      }
    }

    function nearestTarget(dx, dy, distance) {
      if (distance < CONFIG.aimRadius || cloudTargets.length === 0) return null;
      const ux = dx / distance;
      const uy = dy / distance;
      let best = null;
      let bestDot = -1;

      for (const target of cloudTargets) {
        const targetDistance = Math.hypot(target.x, target.y);
        if (!targetDistance) continue;
        const dot = ux * (target.x / targetDistance) + uy * (target.y / targetDistance);
        if (dot > bestDot) {
          best = target;
          bestDot = dot;
        }
      }

      const needed = pointerSpeed >= CONFIG.speedTrigger ? CONFIG.fastSectorCos : CONFIG.sectorCos;
      return bestDot >= needed ? best : null;
    }

    function highlightTarget(target) {
      cloudLayer.querySelectorAll(".bubble.target").forEach((item) => {
        item.classList.remove("target");
      });
      if (!target) return;
      const bubble = Array.from(cloudLayer.querySelectorAll("[data-target-key]"))
        .find((item) => item.dataset.targetKey === target.key);
      if (bubble) bubble.classList.add("target");
    }

    function handleCloudPointer(event) {
      if (activeMode !== "cloud") return;

      const rect = cloudStage.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = event.clientX - centerX;
      const dy = event.clientY - centerY;
      const distance = Math.hypot(dx, dy);
      const now = performance.now();

      if (lastPointer) {
        const dt = Math.max(16, now - lastPointerAt);
        const instantSpeed = Math.hypot(event.clientX - lastPointer.x, event.clientY - lastPointer.y) / dt * 1000;
        pointerSpeed = pointerSpeed * 0.72 + instantSpeed * 0.28;
      }
      lastPointer = { x: event.clientX, y: event.clientY };
      lastPointerAt = now;

      if (distance < CONFIG.centerDeadRadius) {
        resetCloudPointerState();
        return;
      }

      setCloudDriftTarget(-dx * CONFIG.driftScale, -dy * CONFIG.driftScale);

      lastIntent = { dx, dy, distance };
      evaluateCloudIntent(lastIntent, now);
    }

    function evaluateCloudIntent(intent, now = performance.now()) {
      if (now - lastPointerAt > 250) {
        pointerSpeed = 0;
      }
      const target = nearestTarget(intent.dx, intent.dy, intent.distance);
      highlightTarget(target);
      renderVectorHud(target);

      if (gestureIsLocked(intent)) {
        activeTargetKey = "";
        activeTargetSince = 0;
        return;
      }

      if (!target || intent.distance < CONFIG.triggerRadius) {
        activeTargetKey = target ? target.key : "";
        activeTargetSince = target ? now : 0;
        return;
      }

      if (activeTargetKey !== target.key) {
        activeTargetKey = target.key;
        activeTargetSince = now;
        return;
      }

      const dwellMs = pointerSpeed >= CONFIG.speedTrigger ? CONFIG.fastDwellMs : CONFIG.dwellMs;
      if (now - activeTargetSince >= dwellMs && now - lastNavAt >= CONFIG.cooldownMs) {
        lastNavAt = now;
        navigateTarget(target, "auto");
      }
    }

    function tickCloudIntent(now) {
      if (activeMode === "cloud" && lastIntent && rootNode) {
        evaluateCloudIntent(lastIntent, now);
      }
      requestAnimationFrame(tickCloudIntent);
    }

    function resetCloudPointerState() {
      setCloudDriftTarget(0, 0);
      activeTargetKey = "";
      activeTargetSince = 0;
      pointerSpeed = 0;
      lastPointer = null;
      lastIntent = null;
      unlockGesture();
      highlightTarget(null);
      renderVectorHud(null);
    }

    function resetCloudPointer() {
      resetCloudPointerState();
    }

    function renderTreeNode(node, openByDefault = false) {
      const wrapper = document.createElement("section");
      wrapper.className = "tree-node";

      const row = document.createElement("div");
      row.className = "tree-row";

      const toggle = document.createElement("button");
      toggle.className = "tree-toggle";
      toggle.type = "button";
      toggle.textContent = "›";
      toggle.disabled = !canExpand(node);
      toggle.setAttribute("aria-label", `展开 ${node.title || "未命名"}`);

      const title = document.createElement("span");
      title.className = "tree-title";
      title.textContent = node.title || "未命名";

      const status = document.createElement("span");
      status.className = `status ${node.children_status || "pending"}`;
      status.textContent = statusLabel(node.children_status);

      const children = document.createElement("div");
      children.className = "tree-children";

      row.append(toggle, title, status);
      wrapper.append(row, children);

      async function expand() {
        wrapper.classList.add("expanded");
        toggle.textContent = "⌄";
        toggle.setAttribute("aria-label", `收起 ${node.title || "未命名"}`);

        if (children.dataset.loaded === "true") return;
        children.innerHTML = '<div class="message">加载中</div>';

        try {
          const loadedNode = await hydrateNode(node);
          Object.assign(node, loadedNode);
          status.className = `status ${node.children_status || "pending"}`;
          status.textContent = statusLabel(node.children_status);

          children.innerHTML = "";
          const list = Array.isArray(node.children) ? node.children : [];
          if (list.length === 0) {
            const message = document.createElement("div");
            message.className = "message";
            message.textContent = emptyLabel(node);
            children.append(message);
          } else {
            list.forEach((child) => children.append(renderTreeNode(child)));
          }
          children.dataset.loaded = "true";
        } catch (error) {
          status.className = "status error";
          status.textContent = "错误";
          children.innerHTML = '<div class="message">数据文件加载失败</div>';
        }
      }

      function collapse() {
        wrapper.classList.remove("expanded");
        toggle.textContent = "›";
        toggle.setAttribute("aria-label", `展开 ${node.title || "未命名"}`);
      }

      toggle.addEventListener("click", () => {
        if (wrapper.classList.contains("expanded")) {
          collapse();
        } else {
          expand();
        }
      });

      title.addEventListener("click", () => toggle.click());

      if (openByDefault) requestAnimationFrame(() => expand());
      return wrapper;
    }

    function renderTree() {
      treeEl.innerHTML = "";
      treeEl.append(renderTreeNode(rootNode, true));
    }

    function chartLogicalKey(node, fallback = "") {
      return nodeKey(node, fallback);
    }

    function currentChartEntry() {
      return chartTrail[chartTrail.length - 1] || null;
    }

    function selectedChartKey() {
      const entry = currentChartEntry();
      return entry ? chartLogicalKey(entry.node, "root") : "";
    }

    function chartNodeBudget() {
      return chartPerformanceMode === "slow"
        ? CONFIG.chartCompactNodeBudget
        : CONFIG.chartNodeBudget;
    }

    function chartChildLimit() {
      const compact = chartPerformanceMode === "slow" || window.innerWidth <= 740;
      return compact ? CONFIG.chartCompactChildren : CONFIG.chartMaxChildren;
    }

    function chartMinZoom() {
      return chartPerformanceMode === "slow" ? CONFIG.chartSlowMinZoom : CONFIG.chartMinZoom;
    }

    function chartDepthLimit() {
      let depth = 2;
      if (chartZoom < 0.82) depth = 3;
      if (chartZoom < 0.62) depth = 4;
      if (chartPerformanceMode === "slow") depth = Math.min(depth, 3);
      return depth;
    }

    function chartDisplayTrail() {
      if (chartTrail.length > 1) return chartTrail.slice(0, -1);
      return chartTrail.slice();
    }

    function chartVisibleChildren(node) {
      const children = Array.isArray(node.children) ? node.children : [];
      return {
        all: children,
        visible: children.slice(0, chartChildLimit())
      };
    }

    function rememberChartExpansion(node) {
      const key = chartLogicalKey(node);
      if (!key) return;
      chartExpanded.set(key, ++chartExpandTick);
    }

    function pruneChartExpanded(keepKeys) {
      const removable = Array.from(chartExpanded.entries())
        .filter(([key]) => !keepKeys.has(key))
        .sort((a, b) => a[1] - b[1]);

      if (removable.length === 0) return false;
      const removeCount = Math.max(1, Math.ceil(removable.length / 3));
      removable.slice(0, removeCount).forEach(([key]) => chartExpanded.delete(key));
      return true;
    }

    function wrapChartLabel(value) {
      const text = String(value || "未命名");
      if (text.length <= 8) return text;
      const lines = [];
      for (let index = 0; index < text.length && lines.length < 3; index += 8) {
        lines.push(text.slice(index, index + 8));
      }
      return lines.join("\n");
    }

    function chartStatusText(node) {
      const count = chartRenderCount ? `${chartRenderCount} 节点` : "未渲染";
      const depth = `${chartDepthLimit()} 层`;
      const zoom = `${Math.round(chartZoom * 100)}%`;
      const perf = chartPerformanceMode === "slow" ? "保守" : "自适应";
      const hidden = chartHiddenCount > 0 ? ` · 已收起 ${chartHiddenCount}` : "";
      return `${node?.title || "万物"} · ${count} · ${depth} · ${zoom} · ${perf}${hidden}`;
    }

    function updateChartStatus(message) {
      chartStatus.textContent = message || chartStatusText(currentChartEntry()?.node);
    }

    function updateChartButtons() {
      chartBack.disabled = chartTrail.length <= 1;
      chartHome.disabled = chartTrail.length <= 1;
      chartCompact.disabled = chartExpanded.size === 0;
    }

    function loadECharts() {
      if (window.echarts) return Promise.resolve(window.echarts);
      if (echartsLoader) return echartsLoader;

      function loadScript(url, index) {
        updateChartStatus(`加载树状图引擎 ${index + 1}/${CONFIG.echartsUrls.length}`);
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          const timer = window.setTimeout(() => {
            script.remove();
            reject(new Error("ECharts load timed out"));
          }, CONFIG.echartsLoadTimeoutMs);

          script.src = url;
          script.async = true;
          script.onload = () => {
            window.clearTimeout(timer);
            if (window.echarts) {
              resolve(window.echarts);
            } else {
              script.remove();
              reject(new Error("ECharts is unavailable"));
            }
          };
          script.onerror = () => {
            window.clearTimeout(timer);
            script.remove();
            reject(new Error("ECharts load failed"));
          };
          document.head.append(script);
        });
      }

      echartsLoader = (async () => {
        let lastError = null;
        for (let index = 0; index < CONFIG.echartsUrls.length; index += 1) {
          try {
            return await loadScript(CONFIG.echartsUrls[index], index);
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("ECharts load failed");
      })().catch((error) => {
        echartsLoader = null;
        throw error;
      });
      return echartsLoader;
    }

    async function ensureTreeChart() {
      const echarts = await loadECharts();
      if (!treeChart) {
        treeChart = echarts.init(chartCanvas, null, { renderer: "canvas" });
        treeChart.on("click", (params) => {
          if (params.seriesType === "tree" && params.data?.pathKey) {
            selectChartNode(params.data.pathKey);
          }
        });
        treeChart.on("treeroam", handleChartRoam);
        treeChart.on("treeRoam", handleChartRoam);
      }
      return treeChart;
    }

    function syncChartViewport() {
      if (!treeChart) return;
      const option = treeChart.getOption();
      const series = option?.series?.[0] || {};
      if (typeof series.zoom === "number") {
        chartZoom = series.zoom;
      }
      if (Array.isArray(series.center)) {
        chartCenter = series.center;
      }
    }

    function handleChartRoam() {
      if (chartIgnoreRoam) return;
      const previousDepth = chartLastDepthLimit;
      syncChartViewport();

      const minZoom = chartMinZoom();
      if (chartZoom < minZoom || chartZoom > CONFIG.chartMaxZoom) {
        chartZoom = clamp(chartZoom, minZoom, CONFIG.chartMaxZoom);
        renderChart();
        return;
      }

      const nextDepth = chartDepthLimit();
      if (nextDepth !== previousDepth) {
        renderChart();
      } else {
        updateChartStatus();
      }
    }

    function chartShouldExpand(entry, logicalKey, depth, isDisplayRoot) {
      if (depth >= chartDepthLimit()) return false;
      if (isDisplayRoot) return true;
      if (logicalKey === selectedChartKey()) return true;
      return chartExpanded.has(logicalKey);
    }

    function buildChartNode(entry, trail, depth, pathKey) {
      const node = entry.node;
      const logicalKey = chartLogicalKey(node, pathKey);
      const isSelected = logicalKey === selectedChartKey();
      const data = {
        name: node.title || "未命名",
        pathKey,
        logicalKey,
        status: node.children_status || "pending",
        itemStyle: {
          color: isSelected ? CONFIG.chartSelectedColor || "#0f7a8a" : "#ffffff",
          borderColor: isSelected ? "#0f7a8a" : "#9aa8b8",
          borderWidth: isSelected ? 3 : 1.4
        },
        label: {
          color: isSelected ? "#0f4f59" : "#18212f",
          fontWeight: isSelected ? 700 : 500
        }
      };

      chartRenderCount += 1;
      chartNodeContext.set(pathKey, {
        entry,
        trail
      });

      const isDisplayRoot = depth === 0;
      if (!chartShouldExpand(entry, logicalKey, depth, isDisplayRoot)) return data;

      const { all, visible } = chartVisibleChildren(node);
      const children = [];
      const budget = chartNodeBudget();
      for (let index = 0; index < visible.length; index += 1) {
        const child = visible[index];
        if (chartRenderCount >= budget) {
          chartHiddenCount += visible.length - index;
          break;
        }

        const childEntry = {
          node: child,
          parent: node,
          siblings: all,
          index
        };
        const childTrail = trail.concat(childEntry);
        children.push(buildChartNode(childEntry, childTrail, depth + 1, `${pathKey}.${index}`));
      }

      if (all.length > visible.length) {
        chartHiddenCount += all.length - visible.length;
      }
      if (children.length > 0) data.children = children;
      return data;
    }

    function buildChartData() {
      const keepKeys = new Set(chartTrail.map((entry) => chartLogicalKey(entry.node)));
      let data = null;

      for (let attempt = 0; attempt < 3; attempt += 1) {
        chartNodeContext = new Map();
        chartRenderCount = 0;
        chartHiddenCount = 0;
        const displayTrail = chartDisplayTrail();
        const displayEntry = displayTrail[displayTrail.length - 1] || currentChartEntry();
        data = buildChartNode(displayEntry, displayTrail, 0, "root");

        if (chartHiddenCount === 0 || !pruneChartExpanded(keepKeys)) break;
      }

      return data;
    }

    function updateChartPerformance(duration) {
      const budget = chartNodeBudget();
      const enoughNodes = chartRenderCount > CONFIG.chartCompactChildren;
      if (
        chartRenderCount >= budget ||
        (duration > CONFIG.chartSlowMs && enoughNodes) ||
        duration > CONFIG.chartSlowMs * 2.5
      ) {
        chartPerformanceMode = "slow";
        chartZoom = Math.max(chartZoom, CONFIG.chartSlowMinZoom);
        return;
      }

      if (
        chartPerformanceMode === "slow" &&
        duration < CONFIG.chartRecoverMs &&
        chartRenderCount < CONFIG.chartCompactNodeBudget * 0.7
      ) {
        chartPerformanceMode = "normal";
      }
    }

    function chartTooltip(params) {
      const ctx = chartNodeContext.get(params.data?.pathKey);
      const node = ctx?.entry.node;
      if (!node) return params.name;
      const title = node.title || "未命名";
      const children = Array.isArray(node.children) ? node.children.length : 0;
      return `${title}<br/>${statusLabel(node.children_status)} · 子节点 ${children}`;
    }

    function chartOption(data) {
      return {
        tooltip: {
          trigger: "item",
          triggerOn: "mousemove",
          formatter: chartTooltip
        },
        series: [{
          type: "tree",
          data: [data],
          top: 38,
          left: "7%",
          right: "7%",
          bottom: 44,
          orient: "TB",
          roam: true,
          zoom: chartZoom,
          center: chartCenter,
          initialTreeDepth: -1,
          expandAndCollapse: false,
          symbol: "circle",
          symbolSize: 13,
          nodeScaleRatio: 0.35,
          label: {
            position: "bottom",
            verticalAlign: "middle",
            align: "center",
            distance: 8,
            fontSize: 12,
            lineHeight: 15,
            formatter: (params) => wrapChartLabel(params.name)
          },
          leaves: {
            label: {
              position: "bottom",
              verticalAlign: "middle",
              align: "center"
            }
          },
          lineStyle: {
            color: "#a8b4c2",
            width: 1.3,
            curveness: 0.48
          },
          emphasis: {
            focus: "relative"
          },
          animationDuration: chartRenderCount > 70 ? 120 : 260,
          animationDurationUpdate: chartRenderCount > 70 ? 120 : 260
        }]
      };
    }

    async function renderChart() {
      if (!rootNode || activeMode !== "chart") return;
      const token = ++chartRenderToken;
      updateChartStatus("准备树状图");

      try {
        const chart = await ensureTreeChart();
        if (token !== chartRenderToken) return;

        chartZoom = clamp(chartZoom, chartMinZoom(), CONFIG.chartMaxZoom);
        chartLastDepthLimit = chartDepthLimit();
        const start = performance.now();
        const data = buildChartData();
        chartIgnoreRoam = true;
        try {
          chart.setOption(chartOption(data), { notMerge: true, lazyUpdate: false });
        } finally {
          chartIgnoreRoam = false;
        }
        chart.resize();
        updateChartButtons();
        updateNavigation();

        requestAnimationFrame(() => {
          chartRenderMs = performance.now() - start;
          updateChartPerformance(chartRenderMs);
          updateChartStatus();
        });
      } catch (error) {
        chartStatus.textContent = "树状图加载失败";
        updateNavigation();
      }
    }

    async function selectChartNode(pathKey) {
      const ctx = chartNodeContext.get(pathKey);
      if (!ctx) return;

      updateChartStatus(`加载 ${ctx.entry.node.title || "未命名"}`);
      const hydrated = await safeHydrateNode(ctx.entry.node);
      Object.assign(ctx.entry.node, hydrated);
      const nextTrail = ctx.trail.slice();
      nextTrail[nextTrail.length - 1] = Object.assign({}, ctx.entry, {
        node: ctx.entry.node
      });
      chartTrail = nextTrail;
      rememberChartExpansion(ctx.entry.node);
      renderChart();
    }

    function initChartTrailFromCloud() {
      if (chartTrail.length > 0) return;
      chartTrail = cloudTrail.map((entry) => Object.assign({}, entry));
    }

    function resetChartToRoot() {
      if (!rootNode) return;
      chartTrail = [{
        node: rootNode,
        parent: null,
        siblings: [rootNode],
        index: 0
      }];
      chartExpanded = new Map();
      chartZoom = 1;
      chartCenter = ["50%", "20%"];
      renderChart();
    }

    function setMode(mode) {
      activeMode = mode;
      const isCloud = mode === "cloud";
      const isTree = mode === "tree";
      const isChart = mode === "chart";
      cloudView.classList.toggle("active", isCloud);
      treeView.classList.toggle("active", isTree);
      chartView.classList.toggle("active", isChart);
      cloudTab.classList.toggle("active", isCloud);
      treeTab.classList.toggle("active", isTree);
      chartTab.classList.toggle("active", isChart);
      cloudTab.setAttribute("aria-selected", String(isCloud));
      treeTab.setAttribute("aria-selected", String(isTree));
      chartTab.setAttribute("aria-selected", String(isChart));
      if (isCloud) {
        renderCloud();
        resetCloudPointerState();
        cloudStage.focus({ preventScroll: true });
      } else if (isTree) {
        renderTree();
      } else {
        initChartTrailFromCloud();
        renderChart();
      }
      updateNavigation();
    }

    cloudTab.addEventListener("click", () => setMode("cloud"));
    treeTab.addEventListener("click", () => setMode("tree"));
    chartTab.addEventListener("click", () => setMode("chart"));
    reviewFilter.addEventListener("change", renderReviewQueue);
    nodeSearch.addEventListener("input", runSearch);
    searchFilter.addEventListener("change", runSearch);
    clearSearch.addEventListener("click", () => {
      nodeSearch.value = "";
      searchFilter.value = "all";
      searchToken += 1;
      renderSearchMessage("");
      nodeSearch.focus();
    });
    exportMarkdown.addEventListener("click", () => copyContext("markdown", exportMarkdown));
    exportJson.addEventListener("click", () => copyContext("json", exportJson));
    downloadMarkdown.addEventListener("click", () => downloadContext("markdown", downloadMarkdown));
    downloadJson.addEventListener("click", () => downloadContext("json", downloadJson));
    copyNodeApi.addEventListener("click", () => copyApiEndpoint("node", copyNodeApi));
    copyChildrenApi.addEventListener("click", () => copyApiEndpoint("children", copyChildrenApi));
    copyEndNodeApi.addEventListener("click", () => copyApiEndpoint("endNode", copyEndNodeApi));
    copyApiClient.addEventListener("click", () => copyApiEndpoint("client", copyApiClient));

    cloudBack.addEventListener("click", () => {
      if (cloudTrail.length <= 1) return;
      cloudTrail.pop();
      renderCloud();
      resetCloudPointerState();
    });

    cloudHome.addEventListener("click", () => {
      if (cloudTrail.length <= 1) return;
      cloudTrail = cloudTrail.slice(0, 1);
      renderCloud();
      resetCloudPointerState();
    });

    chartBack.addEventListener("click", () => {
      if (chartTrail.length <= 1) return;
      chartTrail.pop();
      rememberChartExpansion(currentChartEntry().node);
      renderChart();
    });

    chartHome.addEventListener("click", resetChartToRoot);

    chartCompact.addEventListener("click", () => {
      const keepKeys = new Set(chartTrail.map((entry) => chartLogicalKey(entry.node)));
      Array.from(chartExpanded.keys()).forEach((key) => {
        if (!keepKeys.has(key)) chartExpanded.delete(key);
      });
      renderChart();
    });

    cloudStage.addEventListener("pointermove", handleCloudPointer);
    cloudStage.addEventListener("pointerleave", resetCloudPointer);
    window.addEventListener("resize", () => {
      if (activeMode === "cloud" && rootNode) renderCloud();
      if (activeMode === "chart" && treeChart) {
        treeChart.resize();
        renderChart();
      }
    });

    async function init() {
      try {
        await Promise.all([loadRoot(), loadGrowthStats(), loadReviewQueue()]);
        renderCloud();
      } catch (error) {
        cloudLayer.innerHTML = '<div class="message">根数据加载失败</div>';
        treeEl.innerHTML = '<div class="message">根数据加载失败</div>';
        chartStatus.textContent = "根数据加载失败";
        metaEl.textContent = "";
      }
    }

    requestAnimationFrame(animateCloudDrift);
    requestAnimationFrame(tickCloudIntent);
    init();
  </script>
</body>
</html>
